[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-final"
version = "0.1.0"
description = "配置驅動的 RAG 框架:Haystack 2.x 之上的薄層(槽位式 YAML + builder)"
requires-python = ">=3.10"
# 與 requirements.txt 同步(基本依賴)
dependencies = [
    "haystack-ai>=2.31,<3.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "pypdf[crypto]>=4.0",  # [crypto] = cryptography:AES 加密的 PDF(常見於公文)需要
    "networkx>=3.0",       # rag/trace.py 的步驟排序(haystack 亦相依,此處顯式宣告)
]

[project.optional-dependencies]
# Online 系統整合(與 requirements-online.txt 同步):
# ES 索引 + 本地 sentence-transformers 模型(embedding 備援 / cross-encoder)。
# sentence-transformers 元件自 Haystack 2.32 起移出 core,一律從整合套件 import。
online = [
    "elasticsearch-haystack>=6.3,<7",
    "sentence-transformers-haystack>=0.1.1,<0.2",
]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not es'"
markers = [
    "es: 需要執行中的 Elasticsearch(設定 ES_URL 後以 -m es 執行)",
]
